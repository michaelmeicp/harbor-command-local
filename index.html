<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f0e7"><title>港灣指揮官 · Harbor Command</title><link rel="stylesheet" href="style.css">
<header><div class="brand"><svg viewBox="0 0 48 48" width="40" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#173e40"/><path d="M11 29h27l-5 7H16zM22 12v15H12zm3-3 11 17H25z" fill="#f3c778"/></svg><div><small>TIDELINE GAMES　/　10</small><h1>港灣指揮官</h1></div></div><button id="help">航海手冊</button></header>
<main><div class="intro"><div><small>HARBOR COMMAND　／　即時策略</small><h2>雙岬海峽<span>海圖 01</span></h2></div><button id="mode">航局設定 ↗</button></div>
<section class="layout"><article class="chart"><div class="chartbar"><b><i></i><span id="session">單人航局</span></b><span id="time"></span><button id="pause">暫停</button></div><div class="map"><svg id="board" tabindex="0" role="application" aria-label="互動海圖，可用方向鍵移動游標，Enter 選取或下令"></svg><div id="box"></div></div><div class="chartfoot"><span>● 青港　 <em>◆ 珊瑚港</em></span><button id="zoom">放大海圖 ＋</button></div>
<div class="mission"><small>OBJECTIVE　／　航標競逐</small><strong id="objective">派艇駐守中央浮標</strong><div class="scores"><span id="scoreA"></span><span id="scoreB"></span></div><div class="meters"><i id="meterA"></i><i id="meterB"></i></div></div></article>
<aside><div class="panel"><small>COMMAND　／　調度台</small><h3 id="sel">艦隊指揮</h3><div class="stock" id="stock"></div><div id="groups" class="pair"><button data-group="worker">全選工人</button><button data-group="scout">全選巡艇</button></div><div class="cmds" id="commands"></div><p id="tip"></p><p id="notice" role="status"></p></div><div class="panel guide"><small>FIELD NOTES　／　領航提示</small><h3 id="lessonTitle"></h3><p id="lesson"></p><button id="next">下一則 →</button></div></aside></section>
<details><summary>航海日誌與海圖操作</summary><p>點選己方單位，再點目標。拖曳框選或用全選按鈕；Shift 點選增減單位。海圖方向鍵移動游標，Enter 執行，Esc 清除。放大後可用方向鍵或點選邊緣移動視野。</p><ol id="events"></ol></details><footer>HC / 10　<span>原創微型即時策略　·　雙岬測繪局</span></footer></main>
